<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<!-- Laboratorinio darbo lapas mokiniui. Atrodo kaip spausdintas darbo lapas
     (Times, juodos lentelių linijos, įrašymo vietos tekste). Reikšmės grąžinamos
     Streamlit'ui kaip {n, v: {klausimo_id: {laukelis: reikšmė}}}.
     Kodas be naujos JS sintaksės – veikia ir senose planšetėse. -->
<style>
  :root { --paper:#fff; --ink:#000; --ink2:#444; --rule:#999; --soft:#eef2f6; --f:"Times New Roman", Times, "Liberation Serif", "Noto Serif", serif; --m:"Courier New", Courier, monospace; }
  .dark { --paper:#1b1b1b; --ink:#e8e8e8; --ink2:#b5b5b5; --rule:#666; --soft:#2a2f36; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font: 19px/1.5 var(--f); padding: 0 2px 10px; }
  h1, h2, p { margin: 0; }
  .mast { padding: 18px 0 12px; text-align: center; }
  .mast .k { font-size: 22px; font-weight: bold; text-transform: uppercase; line-height: 1.35; }
  nav.toc { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 6px 0 0; padding: 6px 0; font-size: 17px;
            display: flex; flex-wrap: wrap; gap: 2px 16px; justify-content: center; }
  .toc a { color: inherit; text-decoration: none; cursor: pointer; }
  .toc a:hover { text-decoration: underline; }
  section { padding-top: 26px; }
  section > h2 { font-size: 20.5px; text-decoration: underline; text-underline-offset: 3px; margin-bottom: 10px; }
  section > h2 small { font-weight: normal; font-size: 17px; text-decoration: none; display: inline-block; margin-left: 6px; color: var(--ink2); }
  .stack { display: grid; gap: 9px; }
  .stack > p { text-align: justify; }
  .label { font-weight: bold; margin-top: 8px; }
  ol { margin: 0; padding-left: 1.5em; }
  ol li { margin: 2px 0; }
  .eq { text-align: center; font-style: italic; padding: 4px 0; }
  figure { margin: 8px 0 4px; display: grid; gap: 4px; justify-items: center; }
  figure img { max-width: min(100%, 1100px); height: auto; background: #fff; display: block; }
  figcaption { font-size: 17px; font-style: italic; text-align: center; }
  input.in { font: inherit; font-size: 18.5px; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--ink);
             border-radius: 0; padding: 0 2px; width: 70px; text-align: center; }
  textarea { font: inherit; font-size: 18.5px; color: var(--ink); background: var(--paper); width: 100%; min-height: 70px; resize: vertical;
             border: 1px solid var(--rule); border-radius: 0; padding: 5px 7px; line-height: 1.4; display: block; }
  input:focus, textarea:focus { outline: none; background: var(--soft); }
  .tcap { font-style: italic; margin: 10px 0 3px; }
  .tbl { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 17.5px; }
  th, td { border: 1px solid var(--ink); }
  th { font-weight: bold; text-align: center; padding: 4px 6px; }
  td.fx { padding: 3px 6px; text-align: center; }
  td.in { padding: 0; }
  td.in input { font: inherit; font-size: 18.5px; color: var(--ink); background: transparent; border: 0; width: 100%; min-width: 60px;
                text-align: center; padding: 4px; }
  .btn { font: inherit; font-size: 17px; padding: 3px 10px; border: 1px solid #767676; border-radius: 2px; background: #efefef; color: #000; cursor: pointer; }
  .btn[aria-pressed="true"] { background: #d4d4d4; box-shadow: inset 0 1px 2px rgba(0,0,0,.25); }
  .chart { margin-top: 6px; border: 1px solid var(--rule); padding: 8px; display: none; }
  .chart.on { display: block; }
  .chart .ctl { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 17px; margin-bottom: 6px; }
  .chart select { font: inherit; font-size: 17px; }
  .chart svg { width: 100%; max-width: 960px; margin: 0 auto; height: auto; display: block; background: #fff; }
  .chart .cap { font-size: 17px; font-style: italic; text-align: center; margin-top: 4px; }
  .padnote { font-style: italic; font-size: 17px; color: var(--ink2); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var root = document.getElementById('root');
  var vals = null, counter = 0, timer = null, built = false, figNo = 0;

  function send(type, extra) {
    var m = { isStreamlitMessage: true, type: type };
    for (var k in extra) m[k] = extra[k];
    window.parent.postMessage(m, '*');
  }
  var lastH = 0;
  function height() {   // tik turinio aukštis (ne lango), kad nesusidarytų augimo ciklas
    var h = Math.ceil(document.body.getBoundingClientRect().height) + 4;
    if (Math.abs(h - lastH) > 1) { lastH = h; send('streamlit:setFrameHeight', { height: h }); }
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function plain(h) { var d = document.createElement('div'); d.innerHTML = h || ''; return d.textContent || ''; }

  function push(now) {
    clearTimeout(timer);
    timer = setTimeout(function () { counter += 1; send('streamlit:setComponentValue', { value: { n: counter, v: vals }, dataType: 'json' }); }, now ? 50 : 1200);
  }
  function field(tid, fk, cls, tag) {
    var el = document.createElement(tag || 'input');
    if (!tag) { el.type = 'text'; el.className = cls || 'in'; el.setAttribute('autocomplete', 'off'); }
    el.value = (vals[tid] && vals[tid][fk]) || '';
    el.addEventListener('input', function () { vals[tid] = vals[tid] || {}; vals[tid][fk] = el.value; push(false); });
    el.addEventListener('change', function () { push(true); });
    return el;
  }
  // tekstas su įrašymo vietomis: segs[0] [laukelis] segs[1] [laukelis] ...
  function segsInto(parent, tid, base, segs) {
    for (var k = 0; k < segs.length; k++) {
      var html = segs[k];
      if (k === 0) html = html.replace(/^(Spėjimas:)/, '<b>$1</b>');
      var sp = document.createElement('span'); sp.innerHTML = html; parent.appendChild(sp);
      if (k < segs.length - 1) { parent.appendChild(document.createTextNode(' ')); parent.appendChild(field(tid, base + '.' + k)); parent.appendChild(document.createTextNode(' ')); }
    }
  }
  function caption(src) {
    var m = /_p(\d)\./.exec(src); if (m) return m[1] + ' dalies principinė schema';
    m = /_s(\d)\./.exec(src); if (m) return m[1] + ' dalies sujungimo schema';
    if (/pavyzdys/.test(src)) return 'Teoriniai grafikų pavyzdžiai';
    return '';
  }
  function num(s) {
    if (s == null) return null;
    var t = String(s).replace(/\s/g, '').replace(',', '.').replace(/[^0-9.\-eE]/g, '');
    if (t === '' || t === '-' || t === '.') return null;
    var v = parseFloat(t); return isNaN(v) ? null : v;
  }

  /* ---------------- grafikas iš lentelės ---------------- */
  function ticks(lo, hi) {
    if (hi <= lo) hi = lo + 1;
    var raw = (hi - lo) / 5, mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), step = mag;
    var ms = [1, 2, 5, 10]; for (var i = 0; i < ms.length; i++) if (ms[i] * mag >= raw) { step = ms[i] * mag; break; }
    var out = []; for (var v = Math.floor(lo / step); v <= Math.ceil(hi / step); v++) out.push(Math.round(v * step * 1e9) / 1e9);
    return out;
  }
  function fmt(v) { var s = Math.abs(v) < 1000 ? String(+v.toPrecision(3)) : String(Math.round(v)); return s.replace('.', ','); }
  function plot(series, xn, yn) {
    var W = 640, H = 340, L = 60, R = 14, T = 14, B = 48, all = [], i, j;
    for (i = 0; i < series.length; i++) all = all.concat(series[i].pts);
    if (!all.length) return '<p class="cap">Įrašykite bent vieną tašką (X ir Y reikšmes) – jis atsiras grafike.</p>';
    var xs = all.map(function (p) { return p[0]; }), ys = all.map(function (p) { return p[1]; });
    var xt = ticks(Math.min(0, Math.min.apply(null, xs)), Math.max.apply(null, xs) * 1.05 || 1);
    var yt = ticks(Math.min(0, Math.min.apply(null, ys)), Math.max.apply(null, ys) * 1.08 || 1);
    var x0 = xt[0], x1 = xt[xt.length - 1], y0 = yt[0], y1 = yt[yt.length - 1];
    function px(v) { return L + (W - L - R) * (v - x0) / ((x1 - x0) || 1); }
    function py(v) { return H - B - (H - B - T) * (v - y0) / ((y1 - y0) || 1); }
    var g = '<svg viewBox="0 0 ' + W + ' ' + H + '" font-family="Times New Roman, serif" font-size="13">';
    for (i = 0; i < xt.length; i++) g += '<line x1="' + px(xt[i]) + '" y1="' + T + '" x2="' + px(xt[i]) + '" y2="' + (H - B) + '" stroke="#e3e3e3"/><text x="' + px(xt[i]) + '" y="' + (H - B + 16) + '" text-anchor="middle">' + fmt(xt[i]) + '</text>';
    for (i = 0; i < yt.length; i++) g += '<line x1="' + L + '" y1="' + py(yt[i]) + '" x2="' + (W - R) + '" y2="' + py(yt[i]) + '" stroke="#e3e3e3"/><text x="' + (L - 6) + '" y="' + (py(yt[i]) + 4) + '" text-anchor="end">' + fmt(yt[i]) + '</text>';
    g += '<path d="M' + L + ' ' + T + 'V' + (H - B) + 'H' + (W - R) + '" fill="none" stroke="#000" stroke-width="1.3"/>';
    g += '<text x="' + ((L + W - R) / 2) + '" y="' + (H - 10) + '" text-anchor="middle" font-style="italic">' + esc(xn) + '</text>';
    g += '<text transform="translate(14 ' + ((T + H - B) / 2) + ') rotate(-90)" text-anchor="middle" font-style="italic">' + esc(yn) + '</text>';
    var dash = ['', '6 4', '2 3', '8 3 2 3'];
    for (i = 0; i < series.length; i++) {
      var pts = series[i].pts.slice().sort(function (a, b) { return a[0] - b[0]; });
      if (pts.length > 1) { var d = ''; for (j = 0; j < pts.length; j++) d += (j ? 'L' : 'M') + px(pts[j][0]).toFixed(1) + ' ' + py(pts[j][1]).toFixed(1);
        g += '<path d="' + d + '" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="' + dash[i % 4] + '"/>'; }
      for (j = 0; j < pts.length; j++) g += i % 2 ? '<rect x="' + (px(pts[j][0]) - 4) + '" y="' + (py(pts[j][1]) - 4) + '" width="8" height="8" fill="#000"/>'
                                                 : '<circle cx="' + px(pts[j][0]) + '" cy="' + py(pts[j][1]) + '" r="4" fill="#000"/>';
      if (series.length > 1) g += '<text x="' + (L + 12) + '" y="' + (T + 14 + 16 * i) + '">' + (i % 2 ? '■ ' : '● ') + esc(series[i].name) + '</text>';
    }
    return g + '</svg>';
  }
  function chartRows(wrap, tid, bi, b) {
    // Lentelė „gulsčia“: pirmoje eilutėje laikas (0, 1, 2 ...), žemiau – dydžiai.
    var head = b.head.map(plain), rows = b.rows, xs = head.slice(1).map(num), opts = [], r;
    for (r = 0; r < rows.length; r++) {
      var hasIn = false; for (var c = 1; c < rows[r].length; c++) if (rows[r][c] === null) hasIn = true;
      if (hasIn) opts.push(r);
    }
    if (!opts.length) return;
    var btn = document.createElement('button'); btn.className = 'btn'; btn.type = 'button'; btn.textContent = 'Grafikas iš lentelės'; btn.setAttribute('aria-pressed', 'false');
    var box = document.createElement('div'); box.className = 'chart';
    var ySel = document.createElement('select');
    for (var i = 0; i < opts.length; i++) ySel.add(new Option(plain(rows[opts[i]][0]), opts[i]));
    var ctl = document.createElement('div'); ctl.className = 'ctl';
    var l2 = document.createElement('label'); l2.textContent = 'Y ašis: '; l2.appendChild(ySel); ctl.appendChild(l2);
    var out = document.createElement('div'); box.appendChild(ctl); box.appendChild(out);
    function draw() {
      if (!box.classList.contains('on')) return;
      var rr = +ySel.value, pts = [];
      for (var k = 1; k < head.length; k++) {
        var cell = rows[rr][k], y = cell === null ? num((vals[tid] || {})['b' + bi + '.r' + rr + '.c' + k]) : num(plain(cell));
        if (xs[k - 1] !== null && y !== null) pts.push([xs[k - 1], y]);
      }
      out.innerHTML = plot([{ name: plain(rows[rr][0]), pts: pts }], head[0], plain(rows[rr][0])); height();
    }
    ySel.onchange = draw;
    btn.onclick = function () { var on = !box.classList.contains('on'); box.classList.toggle('on', on); btn.setAttribute('aria-pressed', on ? 'true' : 'false'); draw(); height(); };
    wrap.addEventListener('input', draw);
    var bar = document.createElement('div'); bar.style.marginTop = '6px'; bar.appendChild(btn);
    wrap.appendChild(bar); wrap.appendChild(box);
  }
  function chartFor(wrap, tid, bi, b) {
    var head = b.head.map(plain), rows = b.rows, inCols = [], c, r;
    var numHead = 0; for (c = 1; c < head.length; c++) if (num(head[c]) !== null && /^\s*-?[\d.,]+\s*$/.test(head[c])) numHead++;
    if (head.length > 3 && numHead >= head.length - 2) { chartRows(wrap, tid, bi, b); return; }
    for (c = 0; c < head.length; c++) for (r = 0; r < rows.length; r++) if (rows[r][c] === null) { inCols.push(c); break; }
    if (inCols.length < 2 || rows.length < 2 || /^Rodiklis/.test(head[0])) return;
    var btn = document.createElement('button'); btn.className = 'btn'; btn.type = 'button'; btn.textContent = 'Grafikas iš lentelės'; btn.setAttribute('aria-pressed', 'false');
    var box = document.createElement('div'); box.className = 'chart';
    var tcol = -1; for (c = 0; c < head.length; c++) if (/^(t\s*,|t$|laikas)/i.test(head[c])) { tcol = c; break; }
    var cand = []; for (c = 0; c < head.length; c++) if (inCols.indexOf(c) >= 0 || c === tcol) cand.push(c);
    var xSel = document.createElement('select'), ySel = document.createElement('select');
    for (var i = 0; i < cand.length; i++) { xSel.add(new Option(head[cand[i]], cand[i])); ySel.add(new Option(head[cand[i]], cand[i])); }
    xSel.value = String(tcol >= 0 ? tcol : inCols[0]);
    ySel.value = String(inCols.filter(function (x) { return String(x) !== xSel.value; })[0]);
    var ctl = document.createElement('div'); ctl.className = 'ctl';
    var l1 = document.createElement('label'); l1.textContent = 'X ašis: '; l1.appendChild(xSel);
    var l2 = document.createElement('label'); l2.textContent = 'Y ašis: '; l2.appendChild(ySel);
    ctl.appendChild(l1); ctl.appendChild(l2);
    var out = document.createElement('div');
    box.appendChild(ctl); box.appendChild(out);
    function col(cc) { var a = []; for (var rr = 0; rr < rows.length; rr++) a.push(rows[rr][cc] === null ? num((vals[tid] || {})['b' + bi + '.r' + rr + '.c' + cc]) : num(plain(rows[rr][cc]))); return a; }
    function draw() {
      if (!box.classList.contains('on')) return;
      var xc = +xSel.value, yc = +ySel.value, xs = col(xc), ys = col(yc), pts = [];
      for (var k = 0; k < xs.length; k++) if (xs[k] !== null && ys[k] !== null) pts.push([xs[k], ys[k]]);
      out.innerHTML = plot([{ name: head[yc], pts: pts }], head[xc], head[yc]); height();
    }
    xSel.onchange = draw; ySel.onchange = draw;
    btn.onclick = function () { var on = !box.classList.contains('on'); box.classList.toggle('on', on); btn.setAttribute('aria-pressed', on ? 'true' : 'false'); draw(); height(); };
    wrap.addEventListener('input', function () { draw(); });
    var bar = document.createElement('div'); bar.style.marginTop = '6px'; bar.appendChild(btn);
    wrap.appendChild(bar); wrap.appendChild(box);
  }

  /* ---------------- darbo lapas ---------------- */
  function build(a) {
    var sh = a.sheet, html, s, i;
    figNo = a.fig0 || 0;
    if (sh.master) {
      var m = document.createElement('div'); m.className = 'mast';
      m.innerHTML = '<div class="k">Laboratorinis darbas</div><div class="k">' + esc(sh.title) + '</div>';
      root.appendChild(m);
      var nav = document.createElement('nav'); nav.className = 'toc';
      for (i = 0; i < sh.toc.length; i++) {
        var ln = document.createElement('a'); ln.textContent = sh.toc[i].title;
        ln.onclick = (function (id) { return function () { var e = document.getElementById(id); if (e) e.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; })('s-' + sh.toc[i].tid);
        nav.appendChild(ln);
      }
      root.appendChild(nav);
    }
    for (s = 0; s < sh.parts.length; s++) {
      var P = sh.parts[s], tid = P.tid, sec = document.createElement('section');
      if (P.from === 0) {
        var h = document.createElement('h2'); h.id = 's-' + tid; h.textContent = P.title;
        if (P.points) { var sm = document.createElement('small'); sm.textContent = '(' + P.points + ' tšk.)'; h.appendChild(sm); }
        sec.appendChild(h);
      } else sec.style.paddingTop = '8px';
      var st = document.createElement('div'); st.className = 'stack'; sec.appendChild(st);
      for (var bi = P.from; bi < P.to; bi++) {
        var b = P.blocks[bi], el;
        if (b.t === 'h') { el = document.createElement('p'); el.className = 'label'; el.innerHTML = b.x; st.appendChild(el); }
        else if (b.t === 'p') {
          var only = b.segs.length === 1 ? b.segs[0] : '';
          if (/^<b>(Lentelė [A-Z][^<]*)<\/b>$/.test(only)) { el = document.createElement('p'); el.className = 'tcap'; el.innerHTML = only.replace(/<\/?b>/g, ''); }
          else if (/^<b>[^<]*:?<\/b>:?$/.test(only)) { el = document.createElement('p'); el.className = 'label'; el.innerHTML = only.replace(/<\/?b>/g, ''); }
          else { el = document.createElement('p'); segsInto(el, tid, 'b' + bi, b.segs); }
          st.appendChild(el);
        }
        else if (b.t === 'ol') {
          el = document.createElement('ol');
          for (i = 0; i < b.items.length; i++) { var li = document.createElement('li'); segsInto(li, tid, 'b' + bi + '.l' + i, b.items[i]); el.appendChild(li); }
          st.appendChild(el);
        }
        else if (b.t === 'table') {
          var wrap = document.createElement('div'), tw = document.createElement('div'); tw.className = 'tbl';
          var t = document.createElement('table'), tr = document.createElement('tr'), c, r;
          for (c = 0; c < b.head.length; c++) { var th = document.createElement('th'); th.innerHTML = b.head[c]; tr.appendChild(th); }
          var thead = document.createElement('thead'); thead.appendChild(tr); t.appendChild(thead);
          var tb = document.createElement('tbody');
          for (r = 0; r < b.rows.length; r++) {
            tr = document.createElement('tr');
            for (c = 0; c < b.rows[r].length; c++) {
              var td = document.createElement('td'), cell = b.rows[r][c];
              var blank = cell !== null && /\.{4,}/.test(cell);
              if (cell === null || blank) {
                td.className = 'in'; var inp = field(tid, 'b' + bi + '.r' + r + '.c' + c, ''); inp.setAttribute('aria-label', plain(b.head[c]) + ', ' + (r + 1) + ' eil.');
                if (blank) {   // pvz. „........ s“ – laukelis ir vienetas
                  var parts = cell.split(/\.{4,}/); td.style.whiteSpace = 'nowrap';
                  inp.style.width = '70%'; inp.style.minWidth = '50px'; inp.style.borderBottom = '1px solid var(--ink)';
                  if (parts[0]) { var a0 = document.createElement('span'); a0.innerHTML = parts[0]; td.appendChild(a0); }
                  td.appendChild(inp);
                  if (parts[1]) { var a1 = document.createElement('span'); a1.innerHTML = parts[1]; td.appendChild(a1); }
                } else td.appendChild(inp);
              }
              else { td.className = 'fx'; td.innerHTML = cell; }
              tr.appendChild(td);
            }
            tb.appendChild(tr);
          }
          t.appendChild(tb); tw.appendChild(t); wrap.appendChild(tw);
          chartFor(wrap, tid, bi, b);
          st.appendChild(wrap);
        }
        else if (b.t === 'img') {
          figNo += 1; var cap = caption(b.src);
          el = document.createElement('figure');
          el.innerHTML = '<img src="' + esc(/^(https?:|data:)/.test(b.src) ? b.src : 'img/' + b.src) + '" alt="' + esc(cap) + '" loading="lazy"><figcaption>' + figNo + ' pav.' + (cap ? ' ' + esc(cap) : '') + '</figcaption>';
          el.querySelector('img').onload = height;
          st.appendChild(el);
        }
        else if (b.t === 'formula') { el = document.createElement('p'); el.className = 'eq'; el.innerHTML = b.x; st.appendChild(el); }
        else if (b.t === 'text') { el = field(tid, 'b' + bi, null, 'textarea'); el.rows = Math.max(3, b.rows || 3); el.style.minHeight = (24 * Math.max(3, b.rows || 3)) + 'px'; st.appendChild(el); }
        else if (b.t === 'pad') { el = document.createElement('p'); el.className = 'padnote'; el.textContent = 'Brėžinį nubraižykite lape žemiau.'; st.appendChild(el); }
      }
      root.appendChild(sec);
    }
    built = true; height();
  }

  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d.type !== 'streamlit:render') return;
    var a = d.args || {};
    var dark = d.theme && d.theme.base === 'dark';
    document.documentElement.classList.toggle('dark', !!dark);
    if (!built) { vals = a.values || {}; build(a); }
    height();
  });
  window.addEventListener('resize', height);
  setInterval(height, 1500);
  send('streamlit:componentReady', { apiVersion: 1 });
})();
</script>
</body>
</html>
